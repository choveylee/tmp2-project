APP_NAME=knowledge-base-backend

KNOWLEDGE_BASE_BACKEND_RUN_MODE=debug

KNOWLEDGE_BASE_BACKEND_HTTP_PORT=8080

KNOWLEDGE_BASE_BACKEND_LOG_LEVEL=DEBUG

KNOWLEDGE_BASE_BACKEND_TIME_LOCATION=Asia/Shanghai

KNOWLEDGE_BASE_BACKEND_SERVER_PING_HOST=
KNOWLEDGE_BASE_BACKEND_SERVER_PING_COUNT=3

KNOWLEDGE_BASE_BACKEND_MYSQL_MAX_IDLE_CONNS=10
KNOWLEDGE_BASE_BACKEND_MYSQL_MAX_OPEN_CONNS=100

KNOWLEDGE_BASE_BACKEND_SERVER_REDIS_POOLSIZE=100

# 内部访问地址。SeaweedFS 使用 S3 Gateway 时，这里填写 S3 Gateway 地址。
KNOWLEDGE_BASE_BACKEND_AWSS3_ENDPOINT=http://127.0.0.1:9000
# 对外访问地址，可配置为 SeaweedFS S3 Gateway、对象存储、CDN 或反向代理地址。
KNOWLEDGE_BASE_BACKEND_AWSS3_ENDPOINT2=http://127.0.0.1:9000

KNOWLEDGE_BASE_BACKEND_AWSS3_ACCESS_KEY=minioadmin
KNOWLEDGE_BASE_BACKEND_AWSS3_SECRET_KEY=minioadmin
KNOWLEDGE_BASE_BACKEND_AWSS3_BUCKET=elder-bucket
KNOWLEDGE_BASE_BACKEND_AWSS3_REGION=us-east-1

KNOWLEDGE_BASE_BACKEND_TEST_SYNC_CRON=

[debug]
KNOWLEDGE_BASE_BACKEND_SERVER_MYSQL_DSN=root:root@(127.0.0.1:3306)/knowledge-base-backend?timeout=30s&parseTime=true&loc=Local&charset=utf8mb4

KNOWLEDGE_BASE_BACKEND_SERVER_REDIS_ADDRESS=127.0.0.1:6379
KNOWLEDGE_BASE_BACKEND_SERVER_REDIS_PASSWORD=

[release]
KNOWLEDGE_BASE_BACKEND_SERVER_MYSQL_DSN=root:root@(127.0.0.1:3306)/knowledge-base-backend?timeout=30s&parseTime=true&loc=Local&charset=utf8mb4

KNOWLEDGE_BASE_BACKEND_SERVER_REDIS_ADDRESS=127.0.0.1:6379
KNOWLEDGE_BASE_BACKEND_SERVER_REDIS_PASSWORD=
